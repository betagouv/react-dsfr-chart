name: Publier sur npm

on:
  push:
    # Une étiquette avec un suffixe (v0.1.0-rc.1) ne va pas sur npm : elle ne
    # produit que l'archive de release.yml.
    tags: ['v*', '!v*-*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Signe le paquet et le relie à ce dépôt, ce commit et ce workflow.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # Aucun cache npm ici : une branche peut empoisonner le cache, et
          # cette tâche est celle qui signe et publie le paquet.
          package-manager-cache: false
      - run: npm ci --ignore-scripts

      - name: Comparer l'étiquette et la version du paquet
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "L'étiquette $TAG ne correspond pas à la version $version du paquet."
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run size
      - run: npm run check:package

      # --provenance ajoute une attestation publique : elle dit de quel commit
      # et de quel workflow vient le paquet. Elle a besoin de id-token: write.
      - name: Publier
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
